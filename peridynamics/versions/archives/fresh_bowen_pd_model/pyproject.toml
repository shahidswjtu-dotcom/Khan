[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bowen-pd-reconstruction"
version = "0.1.0"
description = "Independent, source-audited reconstruction of an RC beam impact model"
requires-python = ">=3.11"
dependencies = ["numpy==2.3.5", "scipy==1.17.0", "numba==0.68.0", "matplotlib==3.10.8"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.setuptools]
packages = ["pdbeam"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
